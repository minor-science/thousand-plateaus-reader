<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem("variorum." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem("variorum." + k, JSON.stringify(v)); } catch (e) {} }
  };
  var P = { "12": D.plateaus[0], "13": D.plateaus[1] };
  var state = { p: "12", i: 0, q: "", ff: "" };
  var opts = store.get("opts", { fr: true, en: true, an: true, gl: true, al: true, fx: true, cm: true, size: 17, list: true, theme: "" });

  function plainText(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent || ""; }
  function norm(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  var searchIndex = null;
  function buildIndex() {
    searchIndex = [];
    ["12", "13"].forEach(function (p) {
      P[p].chunks.forEach(function (c, i) {
        searchIndex.push({ p: p, i: i, t: norm(c.rows.map(function (r) { return plainText(r.join(" \u2016 ")); }).join(" ") + " \u2016 " + plainText(c.notes) + " " + plainText(c.frnotes || "") + " " + (c.mnotes || []).map(function (x) { return plainText(x.t); }).join(" ")) });
      });
    });
  }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function label(p, c) { return p + "\u00b6" + c.n; }
  function umn(c) { return c.umn[0] ? (c.umn[1] && c.umn[1] !== c.umn[0] ? c.umn[0] + "-" + String(c.umn[1]).slice(-2) : c.umn[0]) : "?"; }

  // flag kinds for the filter
  var kinds = {};
  ["12", "13"].forEach(function (p) { P[p].chunks.forEach(function (c) { c.flags.forEach(function (f) { kinds[f.k] = (kinds[f.k] || 0) + 1; }); }); });
  Object.keys(kinds).sort().forEach(function (k) { var o = document.createElement("option"); o.value = k; o.textContent = "Only: " + k.toLowerCase() + " (" + kinds[k] + ")"; $("ff").appendChild(o); });

  function visible() {
    var ch = P[state.p].chunks, out = [];
    for (var i = 0; i < ch.length; i++) {
      if (state.ff && !ch[i].flags.some(function (f) { return f.k === state.ff; })) continue;
      out.push(i);
    }
    return out;
  }

  function renderList() {
    var list = $("list"), html = [];
    if (state.q.length >= 2) {
      if (!searchIndex) buildIndex();
      var q = norm(state.q), hits = [];
      for (var j = 0; j < searchIndex.length && hits.length < 300; j++) {
        var at = searchIndex[j].t.indexOf(q);
        if (at >= 0) hits.push({ e: searchIndex[j], at: at });
      }
      $("sidehead").textContent = hits.length + (hits.length === 300 ? "+" : "") + " chunks contain “" + state.q + "”";
      hits.forEach(function (h) {
        var c = P[h.e.p].chunks[h.e.i], t = h.e.t, a = Math.max(0, h.at - 50);
        var sn = esc(t.slice(a, h.at)) + "<mark>" + esc(t.slice(h.at, h.at + q.length)) + "</mark>" + esc(t.slice(h.at + q.length, h.at + q.length + 70));
        html.push('<a href="#' + h.e.p + "-" + c.n + '"' + (h.e.p === state.p && h.e.i === state.i ? ' class="cur"' : "") + '><span class="id">' + label(h.e.p, c) + '</span><span class="pg">Minn. ' + umn(c) + '</span><span class="sn">' + sn + "</span></a>");
      });
    } else {
      var vis = visible(), ch = P[state.p].chunks;
      $("sidehead").textContent = P[state.p].title + (state.ff ? " · " + vis.length + " with " + state.ff.toLowerCase() : " · " + ch.length + " chunks");
      vis.forEach(function (i) {
        var c = ch[i];
        if (!c._sn) c._sn = esc(plainText(c.rows.map(function (r) { return r[2]; }).join(" ")).replace(/\s+/g, " ").slice(0, 90));

    var cur = list.querySelector(".cur");
    if (cur) cur.scrollIntoView({ block: "nearest" });
  }

  function highlight(el, q) {
    if (!q || q.length < 2) return;
    var nq = norm(q), walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (n) {
      var t = n.nodeValue, nt = norm(t), at = nt.indexOf(nq);
      if (at < 0 || nt.length !== t.length) return;
      var frag = document.createDocumentFragment(), last = 0;
      while (at >= 0) {
        frag.appendChild(document.createTextNode(t.slice(last, at)));
        var m = document.createElement("mark"); m.textContent = t.slice(at, at + nq.length); frag.appendChild(m);
        last = at + nq.length; at = nt.indexOf(nq, last);
      }
      frag.appendChild(document.createTextNode(t.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  }

  function markLexicon(el) {
    el.querySelectorAll("i").forEach(function (i) {
      var k = norm(i.textContent).replace(/[^a-z0-9 ]/g, "").trim();
      if (k && D.lex[k]) { i.classList.add("lx"); i.dataset.k = k; }
    });
  }

  function render() {
    var p = P[state.p], c = p.chunks[state.i];
    $("cid").textContent = label(state.p, c);
    $("cmeta").textContent = p.title + " · Minuit p. " + (c.fr_page || "?") + " · Minnesota p. " + umn(c);
    $("num").value = c.n; $("of").textContent = "of " + p.chunks.length;
    var hdr = '<div class="row"><div class="hdr c-fr"><h2>French (Minuit)</h2></div><div class="hdr c-en"><h2>Minnesota (Massumi)</h2></div><div class="hdr c-an"><h2>Annotated</h2></div></div>';
    var body;
    if (opts.al) {
      body = c.rows.map(function (r) { return '<div class="row"><div class="cell c-fr" lang="fr">' + r[0] + '</div><div class="cell c-en">' + r[1] + '</div><div class="cell c-an an">' + r[2] + "</div></div>"; }).join("");
    } else {
      var j = function (k) { return c.rows.map(function (r) { return r[k]; }).filter(Boolean).join(" "); };
      body = '<div class="row"><div class="cell c-fr" lang="fr">' + j(0) + '</div><div class="cell c-en">' + j(1) + '</div><div class="cell c-an an">' + j(2) + "</div></div>";
    }
    $("cols").innerHTML = hdr + body;
    $("cols").classList.toggle("para", !opts.al);
    var en = c.notes || "", fn = c.frnotes || "";
    $("tnotes").innerHTML = !en && !fn ? '<span class="empty">No notes in this chunk.</span>' :
      (fn ? '<div class="frn"><div><h3>French</h3><div lang="fr">' + fn + '</div></div><div><h3>Annotated</h3><div>' + (en || '<span class="empty">None.</span>') + "</div></div></div>" : en);
    var mn = c.mnotes || [];
    $("hmn").textContent = "Minnesota endnotes (" + mn.length + ")";
    $("tmn").innerHTML = mn.length ? mn.map(function (x) { return '<div class="mnote"><b>' + x.n + '</b>' + (x.after ? '<span class="after">after \u201c\u2026' + x.after + '\u201d</span> ' : "") + x.t + (x.approx ? ' <span class="after">(call placed by judgment)</span>' : "") + "</div>"; }).join("") : '<span class="empty">No endnotes in this chunk.</span>';
    if (state.q) highlight($("tmn"), state.q);
    $("hflags").textContent = "Flags (" + c.flags.length + ")";
    $("tflags").innerHTML = c.flags.length ? c.flags.map(function (f) { return '<div class="flag"><span class="k">' + esc(f.k) + "</span><span>" + f.t + "</span></div>"; }).join("") : '<span class="empty">No flags.</span>';
    $("hctx").textContent = "Background sources (" + c.ctx.length + ")";
    $("tctx").innerHTML = c.ctx.length ? c.ctx.map(function (k) { return '<div class="ctx">' + D.ctx[k] + "</div>"; }).join("") : '<span class="empty">None matched to these pages.</span>';
    document.querySelectorAll("#cols .c-an").forEach(markLexicon); markLexicon($("tnotes"));
    if (state.q) { highlight($("cols"), state.q); highlight($("tnotes"), state.q); }
    $("main").scrollTop = 0;
    renderList();
    var h = "#" + state.p + "-" + c.n;
    if (location.hash !== h) history.replaceState(null, "", h);
    store.set("pos", { p: state.p, n: c.n });
    $("p12").setAttribute("aria-pressed", state.p === "12"); $("p13").setAttribute("aria-pressed", state.p === "13");
  }

  function go(p, n) {
    var ch = P[p].chunks, i = ch.findIndex(function (c) { return c.n === n; });
    if (i < 0) i = 0;
    state.p = p; state.i = i; hidePop(); render();
  }
  function step(d) {
    var vis = visible(), at = vis.indexOf(state.i);
    if (at < 0) { at = 0; for (var j = 0; j < vis.length; j++) if (vis[j] < state.i) at = j; }
    var k = Math.max(0, Math.min(vis.length - 1, at + d));
    if (vis.length) { state.i = vis[k]; hidePop(); render(); }
  }
  function goPage() {
    var pg = parseInt($("page").value, 10), kind = $("pagekind").value;
    if (!pg) return;
    var best = null;
    ["12", "13"].forEach(function (p) {
      P[p].chunks.forEach(function (c, i) {
        var lo = kind === "umn" ? c.umn[0] : c.fr_page, hi = kind === "umn" ? c.umn[1] : c.fr_page;
        if (best === null && lo && lo <= pg && pg <= hi) best = { p: p, i: i };
      });
    });
    if (!best) ["12", "13"].forEach(function (p) { P[p].chunks.forEach(function (c, i) { var lo = kind === "umn" ? c.umn[0] : c.fr_page; if (lo && lo <= pg) best = { p: p, i: i }; }); });
    if (best) { state.p = best.p; state.i = best.i; render(); }
  }

  // term popover
  var pop = $("pop");
  function hidePop() { pop.style.display = "none"; }
  function showPop(k, x, y, shown) {
    var e = D.lex[k], body;
    if (e) {
      body = '<div class="term">' + esc(e.term) + '</div><div class="gl">[' + e.gloss + ']</div><div class="help">Glossed at</div><div class="wh">' +
        e.where.map(function (w) { var a = w.split("-"); return '<a href="#' + w + '">' + a[0] + "\u00b6" + a[1] + "</a>"; }).join(" ") + "</div>";
    } else if (D.short[k] || D.supp[k]) {
      e = { term: shown || k };
      body = '<div class="term">' + esc(e.term) + '</div><div class="gl">' + esc(D.short[k] || D.supp[k]) + "</div>" +
        (D.short[k] ? '<div class="help">From the standing glossary.</div>' : '<div class="help">Translation added for the reader; not one of Jo\u2019s glosses.</div>');
    } else return;
    pop.innerHTML = body + '<div class="act"><button id="psearch">Search for this term</button><button id="pclose">Close</button></div>';
    pop.style.display = "block";
    var r = pop.getBoundingClientRect(), left = Math.min(x, innerWidth - r.width - 12), top = y + 14;
    if (top + r.height > innerHeight - 8) top = Math.max(8, y - r.height - 10);
    pop.style.left = Math.max(8, left) + "px"; pop.style.top = top + "px";
    $("pclose").onclick = hidePop;
    $("psearch").onclick = function () { $("q").value = e.term; state.q = e.term; hidePop(); render(); };
  }
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("b.t, i.lx, .fx");
    if (t) { showPop(t.dataset.k, ev.clientX, ev.clientY, t.textContent); ev.stopPropagation(); return; }
    if (!ev.target.closest("#pop")) hidePop();
  });

  // controls
  function applyOpts() {
    $("cfr").setAttribute("aria-pressed", opts.fr); $("cen").setAttribute("aria-pressed", opts.en);
    $("can").setAttribute("aria-pressed", opts.an); $("cgl").setAttribute("aria-pressed", opts.gl);
    $("toggleList").setAttribute("aria-pressed", opts.list);
    $("cal").setAttribute("aria-pressed", opts.al);
    $("cols").classList.toggle("hide-fr", !opts.fr); $("cols").classList.toggle("hide-en", !opts.en); $("cols").classList.toggle("hide-an", !opts.an);
    $("cols").style.setProperty("--n", (opts.fr + opts.en + opts.an) || 1);
    document.body.classList.toggle("noglosses", !opts.gl);
    document.body.classList.toggle("nofrench", opts.fx === false);
    document.body.classList.toggle("nocompare", opts.cm === false);
    $("cfx").setAttribute("aria-pressed", opts.fx !== false);
    $("ccm").setAttribute("aria-pressed", opts.cm !== false);
    document.documentElement.style.setProperty("--size", opts.size + "px");
    $("wrap").classList.toggle("nolist", !opts.list);
    if (opts.theme) document.documentElement.setAttribute("data-theme", opts.theme); else document.documentElement.removeAttribute("data-theme");
    store.set("opts", opts);
  }
  function tog(id, k) { $(id).onclick = function () { opts[k] = !opts[k]; if (!opts.fr && !opts.en && !opts.an) opts[k] = true; applyOpts(); }; }
  tog("cfr", "fr"); tog("cen", "en"); tog("can", "an");
  $("cgl").onclick = function () { opts.gl = !opts.gl; applyOpts(); };
  $("cal").onclick = function () { opts.al = !opts.al; applyOpts(); render(); };
  $("cfx").onclick = function () { opts.fx = opts.fx === false; applyOpts(); };
  $("ccm").onclick = function () { opts.cm = opts.cm === false; applyOpts(); };
  var narrow = matchMedia("(max-width: 900px)");
  $("toggleList").onclick = function () {
    if (narrow.matches) { $("wrap").classList.toggle("mlist"); return; }
    opts.list = !opts.list; applyOpts();
  };
  $("list").addEventListener("click", function () { $("wrap").classList.remove("mlist"); });
  $("smaller").onclick = function () { opts.size = Math.max(13, opts.size - 1); applyOpts(); };
  $("larger").onclick = function () { opts.size = Math.min(26, opts.size + 1); applyOpts(); };
  $("theme").onclick = function () {
    var dark = opts.theme ? opts.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    opts.theme = dark ? "light" : "dark"; applyOpts();
  };
  $("p12").onclick = function () { if (state.p !== "12") go("12", P["12"].chunks[0].n); };
  $("p13").onclick = function () { if (state.p !== "13") go("13", P["13"].chunks[0].n); };
  $("prev").onclick = function () { step(-1); };
  $("next").onclick = function () { step(1); };
  $("num").onchange = function () { var n = parseInt(this.value, 10); if (n) go(state.p, n); };
  $("go").onclick = goPage;
  $("page").onkeydown = function (e) { if (e.key === "Enter") goPage(); };
  $("ff").onchange = function () { state.ff = this.value; var v = visible(); if (state.ff && v.length && v.indexOf(state.i) < 0) state.i = v[0]; render(); };
  var qt = null;
  $("q").oninput = function () { var v = this.value; clearTimeout(qt); qt = setTimeout(function () { state.q = v.trim(); render(); }, 220); };
  $("q").onkeydown = function (e) {
    if (e.key === "Enter") { var a = $("list").querySelector("a"); if (a) location.hash = a.getAttribute("href"); }
    if (e.key === "Escape") { this.value = ""; state.q = ""; this.blur(); render(); }
  };
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.matches && e.target.matches("input, select, textarea")) return;
    if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
    else if (e.key === "/") { $("q").focus(); e.preventDefault(); }
    else if (e.key === "Escape") hidePop();
  });
  function fromHash() {
    var m = location.hash.match(/^#(12|13)-(\d+)$/);
    if (m) { go(m[1], parseInt(m[2], 10)); return true; }
    return false;
  }
  window.addEventListener("hashchange", fromHash);

  applyOpts();
  if (!fromHash()) { var pos = store.get("pos", null); if (pos && P[pos.p]) go(pos.p, pos.n); else go("12", 1); }
})();
</script>
</body>
</html>
